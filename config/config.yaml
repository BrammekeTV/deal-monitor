# =============================================================================
# deal-monitor configuration
# Secrets (tokens, webhooks) should be placed in .env – never here.
# =============================================================================

# ---------------------------------------------------------------------------
# Scraper settings
# ---------------------------------------------------------------------------
scraper:
  # How often to run a full scrape cycle (seconds).  Actual delay is randomised
  # between interval_min and interval_max to reduce anti-bot fingerprinting.
  interval_min: 60     # 1 minute
  interval_max: 300    # 5 minutes

  # Number of days before a pending review queue entry is automatically
  # marked as 'expired'.  Set to 0 to disable automatic expiry.
  review_queue_expiry_days: 30

  # Number of results to fetch per search term per cycle.
  results_per_term: 30

  # Allow Playwright as a fallback when FlareSolverr is configured but does
  # not return usable results.  Defaults to false because FlareSolverr is
  # significantly faster; set to true only if you need Playwright as a backup.
  playwright_fallback: false

  # Playwright browser settings.
  headless: true
  browser: "chromium"   # chromium | firefox | webkit

  # Delay range (seconds) between individual Playwright page navigations.
  page_delay_min: 2.0
  page_delay_max: 5.0

  # Retry settings for failed requests.
  max_retries: 3
  retry_delay: 10

  # Country filter – leave empty to search all countries.
  # Uses ISO-3166-1 alpha-2 codes, e.g. ["NL", "BE", "DE"].
  countries: ["NL"]

# ---------------------------------------------------------------------------
# Search terms
# ---------------------------------------------------------------------------
search_terms:
  - "Pokemon"

# ---------------------------------------------------------------------------
# Deal detection
# ---------------------------------------------------------------------------
deal:
  # Maximum price (EUR) to consider a listing at all.
  max_price: 500.0

  # Keywords that disqualify a listing entirely (case-insensitive).
  blacklist_keywords:
    - "fake"
    - "proxy"
    - "replica"
    - "damaged"
    - "lot of stickers"

  # Minimum seller star rating (Vinted shows 1–5).  Set to 0 to disable.
  min_seller_rating: 0.0

# ---------------------------------------------------------------------------
# Cardmarket
# ---------------------------------------------------------------------------
cardmarket:
  # Set to false to disable Cardmarket lookups entirely.
  enabled: true

  # Fuzzy match confidence threshold (0–100) for learning database lookups.
  # Matches below this score are sent to the review queue.
  fuzzy_threshold: 80.0

# ---------------------------------------------------------------------------
# Cardmarket Product Catalog (S3 bulk download)
# ---------------------------------------------------------------------------
catalog:
  # When enabled, card prices are resolved from the Cardmarket Product Catalog
  # and Price Guide JSON files (downloaded from S3) instead of scraping
  # individual product pages via FlareSolverr or Playwright.  This is
  # significantly faster and does not require a browser at all.
  # Set to false to fall back to browser-based scraping for every listing.
  enabled: true

  # How often (hours) to refresh the cached catalog files.
  # The catalog is re-downloaded at most once per cycle during this interval.
  refresh_hours: 24

  # Directory where catalog JSON files are persisted between bot restarts.
  cache_dir: "data/catalog_cache"

# ---------------------------------------------------------------------------
# Discord
# ---------------------------------------------------------------------------
discord:
  # Discord channel ID to post profit alerts (can also be set via DISCORD_CHANNEL_ID env var).
  channel_id: 0

  # Discord channel ID for listings that were correctly identified but are not a good deal.
  # Use this to verify the tool is working even when no profitable deals are found.
  # Can also be set via DISCORD_MATCH_CHANNEL_ID env var.
  match_channel_id: 0

  # Discord channel ID for community review of unidentified listings (e.g. #card-review).
  # Can also be set via DISCORD_REVIEW_CHANNEL_ID env var.
  review_channel_id: 0

  # Discord channel ID for listings that could not be matched via the product
  # catalog or the learning database.  Users reply here with the correct
  # Cardmarket product URL or ID so the bot can learn for future runs.
  # Can also be set via DISCORD_UNIDENTIFIED_CHANNEL_ID env var.
  unidentified_channel_id: 0

  # Discord channel ID for error and scraping failure reports.
  # Can also be set via DISCORD_LOG_CHANNEL_ID env var.
  log_channel_id: 0

  # Discord channel ID for a persistent auto-updating status message.
  # When set, the bot will post (or edit) a single status embed in this
  # channel after every monitoring cycle.
  # Can also be set via DISCORD_STATUS_CHANNEL_ID env var.
  status_channel_id: 0

  # Colour (hex) used for embed accents.
  embed_colour: 0x00FF7F
